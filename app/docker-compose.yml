services:
  ollama:
    image: ollama/ollama
    container_name: receipt-ocr-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  receipt-ocr-api:
    container_name: receipt-ocr-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:
