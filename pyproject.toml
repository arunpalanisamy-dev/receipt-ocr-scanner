[project]
name = "receipt-ocr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
]
[project.scripts]
receipt-ocr = "receipt_extraction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_extraction"]