[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "receipt-ocr"
description = "A package for extracting structured data from receipts."
readme = "README.md"
keywords = [ "llm", "ocr", "receipts", "tesseract" ]
license = { file = "LICENSE" }
authors = [ { name = "Bhimraj Yadav", email = "bhimrajyadav977@gmail.com" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = [ "version" ]
dependencies = [ "openai==3.29", "pillow==12.3", "python-dotenv==1.2.4" ]
urls."Bug Tracker" = "https://github.com/bhimrazy/receipt-ocr/issues"
urls."Source Code" = "https://github.com/bhimrazy/receipt-ocr"
urls.Documentation = "https://github.com/bhimrazy/receipt-ocr"
urls.Download = "https://github.com/bhimrazy/receipt-ocr"
urls.Homepage = "https://github.com/bhimrazy/receipt-ocr"
scripts.receipt-ocr = "receipt_ocr.cli:main"

[dependency-groups]
dev = [ "codecov", "coverage", "pillow", "pytest", "pytest-cov" ]

[tool.hatch]
build.targets.wheel.packages = [ "src/receipt_ocr" ]
metadata.allow-direct-references = true
version.path = "src/receipt_ocr/__about__.py"
version.pattern = '__version__ = "(?P<version>.+)"'

[tool.pytest]
ini_options.pythonpath = [ "src" ]

[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [ "E4", "E7", "E9", "F", "D" ]
ignore = [ "D1" ]
fixable = [ "ALL" ]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
